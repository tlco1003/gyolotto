        <div style={C}><div style={LL}>🔮 개요</div><div style={{fontSize:11,color:"#c0b8d4",lineHeight:1.8}}><p style={{margin:"0 0 8px"}}>vGYO는 과거 당첨번호의 <strong style={{color:"#f5d76e"}}>통계적 패턴</strong>을 6개 신호 차원으로 분석하여, 출현 가능성이 높은 번호 조합을 생성하는 연구용 엔진입니다.</p><p style={{margin:"0 0 8px"}}>매주 앱을 열면 <strong style={{color:"#4ade80"}}>동행복권 API</strong>로 최신 당첨번호를 자동 업데이트합니다.</p><p style={{margin:0,fontSize:10,color:"#FF7272"}}>⚠️ 로또는 독립시행 확률 게임입니다. 이 엔진은 연구/실험 목적이며 당첨을 보장하지 않습니다.</p></div></div>

        <div style={C}><div style={LL}>🎯 예측 탭</div><div style={{fontSize:11,color:"#c0b8d4",lineHeight:1.8}}><div style={{marginBottom:4}}><strong style={{color:"#f5d76e"}}>번호 잠금</strong> — 반드시 포함할 번호 (최대 5개)</div><div style={{marginBottom:4}}><strong style={{color:"#f5d76e"}}>온도</strong> — 높을수록 랜덤, 낮을수록 상위 집중</div><div style={{marginBottom:4}}><strong style={{color:"#f5d76e"}}>리스크</strong> — 안정(보수적) / 기본(표준) / 공격(넓은 범위)</div><div style={{fontSize:10,color:"#8b85a0"}}>Rarity: 합계/홀짝/AC/소수/구간의 경험적 희귀도</div></div></div>
        <div style={C}><div style={LL}>🔬 검증</div><div style={{fontSize:11,color:"#c0b8d4",lineHeight:1.8}}><div style={{marginBottom:4}}><strong style={{color:"#4ade80"}}>워크포워드</strong> — i번째 예측 시 i 이전 데이터만 사용</div><div style={{marginBottom:4}}><strong style={{color:"#4ade80"}}>6-Game Sampling</strong> — 매 회차 6게임 생성 → 평균 매치 측정</div><div style={{marginBottom:4}}><strong style={{color:"#4ade80"}}>Top15 적중률</strong> — 기대값 33.3% (6/45×15)</div></div></div>
        <div style={C}><div style={LL}>⚗️ 실험실</div><div style={{fontSize:11,color:"#c0b8d4",lineHeight:1.8}}><div style={{marginBottom:4}}><strong style={{color:"#d4af37"}}>Auto-Tune</strong> — SA 300회 + 멀티리스타트. 목적함수 = Top15 적중률 최대화</div><div style={{marginBottom:4}}><strong style={{color:"#d4af37"}}>가중치/윈도우</strong> — 14개 신호 비중 및 참조 범위 조절</div><div style={{marginBottom:4}}><strong style={{color:"#d4af37"}}>14 신호</strong> — 주기, 모멘텀, 전이, 2차전이, 대역, 연속, 합구간, 홀짝, 냉각복귀, 끝수, 구간균형, 합방향, 페어, 기본</div></div></div>
        <div style={C}><div style={LL}>💾 데이터</div><div style={{fontSize:11,color:"#c0b8d4",lineHeight:1.8}}><div style={{marginBottom:4}}>닉네임, 설정, 예측기록, 백테스트 결과가 브라우저 localStorage에 자동저장됩니다.</div><div style={{color:"#FF7272",fontSize:10}}>로그아웃 시 모든 데이터가 삭제됩니다.</div></div></div>
        <div style={Object.assign({},C,{background:"rgba(212,175,55,0.04)",textAlign:"center"})}><div style={{fontSize:10,color:"#6b6580",lineHeight:1.7}}>로또엔진 vGYO<br/>Markov · Decade · Hypergeometric Pair · Softmax<br/>Walk-Forward BT · SA Auto-Tune · AC/Prime · Rarity</div></div>
      </div>}
    </div>
  );
}
